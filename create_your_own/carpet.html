<!doctype html>
<html lang=en>
   <meta charset=UTF-8>
   <meta name=viewport content="width=device-width,shrink-to-fit=0,user-scalable=no,minimum-scale=1,maximum-scale=1">
   <title>Devi Parikh - Algorithmic Art</title>
   <link href="cyo_site.css" rel="stylesheet" type="text/css">
   <link rel="icon" type="image/x-icon" href="../static/img/art/carpet.png">
	   <body class="cyo-page-body cyo-carpet-page">
	      <div class="cyo-page cyo-page--wide">
	      <header class="cyo-topbar">
	         <a href="/art#cyo">Other styles by Devi Parikh</a>
	      </header>
	      <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/0.9.0/p5.js"></script>
	      <script src="https://cdnjs.cloudflare.com/ajax/libs/seedrandom/3.0.5/seedrandom.js"></script>
	      <div class="cyo-layout">
	      <aside id="div1" class="cyo-stack">
        <script src="updateTwitter.js"></script>
        <script>
          function doPerPaletteRadioButton() {
          var url_string = window.location.href;
              var url = new URL(url_string);
              url.searchParams.set('pid',$("input[name='palette']:checked").val());
              window.history.pushState("", "", url.href);
              setup();
              updateTwitter();
            }
            function doPerEcolorRadioButton() {
            var url_string = window.location.href;
              var url = new URL(url_string);
              url.searchParams.set('s',$("input[name='ecolor']:checked").val());
              window.history.pushState("", "", url.href);
              setup();
              updateTwitter();
            }
        </script>
         <div class="cyo-eyebrow">Algorithmic Art</div>
         <h1 class="cyo-title">Carpet</h1>
         <p class="cyo-text cyo-intro">Adjust the grid, line count, and thickness to weave a carpet pattern.</p>
	         <div class="cyo-stack-sm">
	         <div class="cyo-eyebrow cyo-section-title">Palette</div>
	         <div class="cyo-swatch-grid cyo-swatch-grid--palette">
	         <input id = "0" type="radio" name="palette" value="0" checked="checked">
	         <label class="cyo-swatch" for="0"><span class="cyo-swatch-circle" style="background: conic-gradient(rgb(30, 39, 46) 0 20%, rgb(47, 53, 66) 20% 40%, rgb(87, 96, 111) 40% 60%, rgb(164, 176, 190) 60% 80%, rgb(206, 214, 224) 80% 100%);"></span></label>
	         <input id = "1" type="radio" name="palette" value="1">
	         <label class="cyo-swatch" for="1"><span class="cyo-swatch-circle" style="background: conic-gradient(#111111 0 50%, #f5f5f5 50% 100%);"></span></label>
	         <input id = "2" type="radio" name="palette" value="2">
	         <label class="cyo-swatch" for="2"><span class="cyo-swatch-circle" style="background: conic-gradient(rgb(216, 78, 95) 0 25%, rgb(2, 100, 228) 25% 50%, rgb(47, 77, 71) 50% 75%, rgb(248, 165, 74) 75% 100%);"></span></label>
	         <input id = "3" type="radio" name="palette" value="3">
	         <label class="cyo-swatch" for="3"><span class="cyo-swatch-circle" style="background: conic-gradient(rgb(182, 82, 48) 0 50%, rgb(11, 32, 59) 50% 100%);"></span></label>
	         <input id = "4" type="radio" name="palette" value="4">
	         <label class="cyo-swatch" for="4"><span class="cyo-swatch-circle" style="background: conic-gradient(rgb(124, 203, 181) 0 20%, rgb(241, 188, 82) 20% 40%, rgb(108, 182, 200) 40% 60%, rgb(186, 183, 175) 60% 80%, rgb(254, 116, 83) 80% 100%);"></span></label>
	         </div>
	         </div>
	         <div class="cyo-control-stack cyo-control-stack--compact">
	         <div class="cyo-slider-group">
	         <div class="cyo-control-label">
	         <span class="cyo-control-title">Grid</span>
	         <span id="sng" class="cyo-control-value">16</span>
	         </div>
	         <input id="ngSlider" type="range" min="5" max="60" step="1" value="16" class="slider">
	         </div>
	         <p class="cyo-note cyo-section-note">If lines &lt; 3, consider turning self-color off.</p>
	         <div class="cyo-slider-group">
	         <div class="cyo-control-label">
	         <span class="cyo-control-title">Lines</span>
	         <span id="snl" class="cyo-control-value">3</span>
	         </div>
	         <input id="nlSlider" type="range" min="2" max="7" step="1" value="3" class="slider">
	         </div>
	         <div class="cyo-slider-group">
	         <div class="cyo-control-label">
	         <span class="cyo-control-title">Thickness</span>
	         <span id="ssw" class="cyo-control-value">2</span>
	         </div>
	         <input id="swSlider" type="range" min="2" max="7" step="1" value="2" class="slider">
	         </div>
	         <div class="cyo-inline-control">
	         <span class="cyo-control-title">Self-colored lines</span>
	         <div class="cyo-toggle-group">
	         <input id = "s1" type="radio" name="ecolor" value="1" checked = "checked"> <label for="s1">Yes</label>
	         <input id = "s0" type="radio" name="ecolor" value="0" > <label for="s0">No</label>
	         </div>
	         </div>
	         </div>
         <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>

        <script>
            var url_string = window.location.href;
            var url = new URL(url_string);
            var pid = url.searchParams.get("pid");
            var ng = url.searchParams.get("ng");
            var nl = url.searchParams.get("nl");
            var sw = url.searchParams.get("sw");
            var s = url.searchParams.get("s");
            var seed = url.searchParams.get("seed");
            if (pid == null){
              pid = $("input[name='palette']:checked").val();
              url.searchParams.append('pid',pid);
            }
            if (ng == null){
              ng = ngSlider.value;
              url.searchParams.append('ng',ng);
            }
            if (nl == null){
              nl = nlSlider.value;
              url.searchParams.append('nl',nl);
            }
            if (sw == null){
              sw = swSlider.value;
              url.searchParams.append('sw',sw);
            }
            if (s == null){
              s = $("input[name='ecolor']:checked").val();
              url.searchParams.append('s',s);
            }
            if (seed == null){
              seed = Math.random();
              url.searchParams.append('seed',seed);
            };
            document.getElementById(pid).checked = true;
            document.getElementById(['s'+s]).checked = true;
            document.getElementById("ngSlider").value = Number(ng);
            document.getElementById("sng").innerHTML = ngSlider.value;
            document.getElementById("nlSlider").value = Number(nl);
            document.getElementById("snl").innerHTML = nlSlider.value;
            document.getElementById("swSlider").value = Number(sw);
            document.getElementById("ssw").innerHTML = swSlider.value;
            window.history.pushState("", "", url.href);
            //console.log(url.href);         
            var ngdefault = ng;
            var nldefault = nl;
            var piddefault = pid;
            var sdefault = s;
            var swdefault = sw;
            var seeddefault = seed;
         </script>

         <script type="text/javascript">
              //$("#ngSlider").slider({
                //start: function(event, ui) {
                //},
                //stop: function(event, ui) {
                //setup(seed);
                //}
              //});
              $(document).on('change', '#ngSlider', function() {
                  setup();
                  updateTwitter();
              });
              $(document).on('input', '#ngSlider', function() {
                  document.getElementById("sng").innerHTML = ngSlider.value;
                  var url_string = window.location.href;
                  var url = new URL(url_string);
                  url.searchParams.set('ng', ngSlider.value);
                  window.history.pushState("", "", url.href);
              });

              $(document).on('change', '#nlSlider', function() {
                  setup();
                  updateTwitter();
              });
              $(document).on('input', '#nlSlider', function() {
                  document.getElementById("snl").innerHTML = nlSlider.value;
                  var url_string = window.location.href;
                  var url = new URL(url_string);
                  url.searchParams.set('nl', nlSlider.value);
                  window.history.pushState("", "", url.href);
              });

              $(document).on('change', '#swSlider', function() {
                  setup();
                  updateTwitter();
              });
              $(document).on('input', '#swSlider', function() {
                  document.getElementById("ssw").innerHTML = swSlider.value;
                  var url_string = window.location.href;
                  var url = new URL(url_string);
                  url.searchParams.set('sw', swSlider.value);
                  window.history.pushState("", "", url.href);
              });
              

              $(document).on('input', '#0', function() {
                   doPerPaletteRadioButton();
               });
               $(document).on('input', '#1', function() {
                   doPerPaletteRadioButton();
               });
               $(document).on('input', '#2', function() {
                   doPerPaletteRadioButton();
               });
               $(document).on('input', '#3', function() {
                   doPerPaletteRadioButton();
               });
               $(document).on('input', '#4', function() {
                   doPerPaletteRadioButton();
               });
               $(document).on('input', '#s0', function() {
                   doPerEcolorRadioButton();
               });
               $(document).on('input', '#s1', function() {
                   doPerEcolorRadioButton();
               });
         </script>
         <script type="text/javascript">
            function generate() {
              var url_string = window.location.href;
              var url = new URL(url_string);
              var seed = Math.random();
              url.searchParams.set('seed',seed);
              window.history.pushState("", "", url.href);
              setup();
              updateTwitter();
            };
         </script>
         <script type="text/javascript">
            function reset() {
              var url_string = window.location.href;
              var url = new URL(url_string);
              url.searchParams.set('ng', ngdefault);
              url.searchParams.set('nl', nldefault);
              url.searchParams.set('pid', piddefault);
              url.searchParams.set('sw', swdefault);
              url.searchParams.set('s', sdefault);
              url.searchParams.set('seed', seeddefault);
              document.getElementById(piddefault).checked = true;
              document.getElementById(['s'+sdefault]).checked = true;
              document.getElementById("ngSlider").value = Number(ngdefault);
              document.getElementById("sng").innerHTML = ngSlider.value;
              document.getElementById("nlSlider").value = Number(nldefault);
              document.getElementById("snl").innerHTML = nlSlider.value;
              document.getElementById("swSlider").value = Number(swdefault);
              document.getElementById("ssw").innerHTML = swSlider.value;
              window.history.pushState("", "", url.href);
              setup();
              updateTwitter();
            };
         </script>
	         <div class="cyo-action-stack">
	         <div class="cyo-actions-grid">
	         <button type="button" onClick="generate()">Generate</button>
	         <button type="button" onClick="reset()">Reset</button>
	         </div>
	         <div class="cyo-actions-grid">
	         <a id="download" download="myart.png" target="_blank">
	         <button type="button" onClick="download()">Save PNG</button>
	         </a>
	         <button type="button" onClick="postOnX()">Post on X</button>
	         </div>
	         </div>
         <script type="text/javascript">
            function download() {
              var download = document.getElementById("download");
              var image = document.getElementById("mycanvas").toDataURL("image/png");
              download.setAttribute("href", image);
            }
         </script>
	        <div class="cyo-note-block">
	        <p class="cyo-legal cyo-note">Not to be used for commercial purposes without prior consent.</p>
	        </div>
         <script>
           updateTwitter();
         </script>
         
	      </aside>
	      <div class="cyo-canvas-shell">
	      <div id="sketch-holder">
	         <script>
	            $(window).bind("load", function() {
	               seed = Math.random();
               setup(seed);
            });
	         </script>
	         <script src="carpet.js"></script>
	      </div>
	      </div>
	      </div>
