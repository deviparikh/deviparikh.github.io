<!doctype html>
<html lang=en>
   <meta charset=UTF-8>
   <meta name=viewport content="width=device-width,shrink-to-fit=0,user-scalable=no,minimum-scale=1,maximum-scale=1">
   <title>Devi Parikh - Algorithmic Art</title>

   <link rel="icon" type="image/x-icon" href="../static/img/art/strokes.png">
   <body class="cyo-page-body cyo-strokes-page">
      <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/0.9.0/p5.js"></script>
      <script src="https://cdnjs.cloudflare.com/ajax/libs/seedrandom/3.0.5/seedrandom.js"></script>
      <div class="cyo-page cyo-page--wide">
      <header class="cyo-topbar">
         <a href="/art#cyo">Other styles by Devi Parikh</a>
      </header>
      <div class="cyo-layout">
      <aside id="div1" class="cyo-stack">
        <script src="updateTwitter.js"></script>

        <script>
          function doPerPaletteRadioButton() {
          var url_string = window.location.href;
              var url = new URL(url_string);
              url.searchParams.set('pid',$("input[name='palette']:checked").val());
              //console.log(url.href);
              window.history.pushState("", "", url.href);
              setup();
              updateTwitter();
            }
            function doPerCurvyRadioButton() {
            var url_string = window.location.href;
              var url = new URL(url_string);
              url.searchParams.set('c',$("input[name='curvy']:checked").val());
              //console.log(url.href);
              window.history.pushState("", "", url.href);
              setup();
              updateTwitter();
            }
        </script>

          <div class="cyo-eyebrow">Algorithmic Art</div>
         <h1 class="cyo-title">Strokes</h1>
         <p class="cyo-text cyo-intro">Adjust density, thickness, and curvature to build a field of strokes.</p>
         <div class="cyo-stack-sm">
         <div class="cyo-eyebrow cyo-section-title">Palette</div>
         <div class="cyo-swatch-grid cyo-swatch-grid--palette">
         <input id = "0" type="radio" name="palette" value="0">
         <label class="cyo-swatch" for="0"><span class="cyo-swatch-circle" style="background: conic-gradient(rgb(30, 39, 46) 0 20%, rgb(47, 53, 66) 20% 40%, rgb(87, 96, 111) 40% 60%, rgb(164, 176, 190) 60% 80%, rgb(206, 214, 224) 80% 100%);"></span></label>
         <input id = "1" type="radio" name="palette" value="1">
         <label class="cyo-swatch" for="1"><span class="cyo-swatch-circle" style="background: rgb(48, 53, 66);"></span></label>
         <input id = "2" type="radio" name="palette" value="2">
         <label class="cyo-swatch" for="2"><span class="cyo-swatch-circle" style="background: conic-gradient(rgb(216, 78, 95) 0 25%, rgb(2, 100, 228) 25% 50%, rgb(47, 77, 71) 50% 75%, rgb(248, 165, 74) 75% 100%);"></span></label>
         <input id = "3" type="radio" name="palette" value="3">
         <label class="cyo-swatch" for="3"><span class="cyo-swatch-circle" style="background: conic-gradient(rgb(182, 82, 48) 0 50%, rgb(11, 32, 59) 50% 100%);"></span></label>
         <input id = "4" type="radio" name="palette" value="4" checked="checked">
         <label class="cyo-swatch" for="4"><span class="cyo-swatch-circle" style="background: conic-gradient(rgb(124, 203, 181) 0 20%, rgb(241, 188, 82) 20% 40%, rgb(108, 182, 200) 40% 60%, rgb(186, 183, 175) 60% 80%, rgb(254, 116, 83) 80% 100%);"></span></label>
         </div>
         </div>
         <div class="cyo-control-stack cyo-control-stack--compact">
         <div class="cyo-slider-group">
         <div class="cyo-control-label">
         <span class="cyo-control-title">Density</span>
         <span id="showNumEntities" class="cyo-control-value">7</span>
         </div>
         <input id="numEntitiesSlider" type="range" min="0" max="10" step="1" value="7" class="slider">
         </div>
         <div class="cyo-slider-group">
         <div class="cyo-control-label">
         <span class="cyo-control-title">Thickness</span>
         <span id="showStrokeWidth" class="cyo-control-value">5</span>
         </div>
         <input id="strokeWidthSlider" type="range" min="1" max="15" value="5" class="slider">
         </div>
         <!--
            Curve
            <input id="curvySlider" type="range" min="0" max="0.9" step="0.1" value="0.2" class="slider">    
            <a id="showCurvy">0.2</a>
            <p>
            -->
         <div class="cyo-inline-control">
         <span class="cyo-control-title">Curved</span>
         <div class="cyo-toggle-group">
         <input id = "c1" type="radio" name="curvy" value="1" checked = "checked"> <label for="c1">Yes</label>
         <input id = "c0" type="radio" name="curvy" value="0"> <label for="c0">No</label>
         </div>
         </div>
         </div>
         
         <!--
            Switches
            <input id="shapeSwitchSlider" type="range" min="0" max="1" step="0.2" value="0.2" class="slider">    
            <a id="showShapeSwitch">0.2</a>
            <p>
            -->
         <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>

        <script>
            var url_string = window.location.href;
            var url = new URL(url_string);
            var pid = url.searchParams.get("pid");
            var n = url.searchParams.get("n");
            var sw = url.searchParams.get("sw");
            var c = url.searchParams.get("c");
            var seed = url.searchParams.get("seed");
            if (pid == null){
              pid = $("input[name='palette']:checked").val();
              url.searchParams.append('pid',pid);
            }
            if (n == null){
              n = numEntitiesSlider.value;
              url.searchParams.append('n',n);
            }
            if (sw == null){
              sw = strokeWidthSlider.value;
              url.searchParams.append('sw',sw);
            }
            if (c == null){
              c = $("input[name='curvy']:checked").val();
              url.searchParams.append('c',c);
            }
            if (seed == null){
              seed = Math.random();
              url.searchParams.append('seed',seed);
            };
            document.getElementById(pid).checked = true;
            document.getElementById(['c'+c]).checked = true;
            document.getElementById("numEntitiesSlider").value = Number(n);
            document.getElementById("showNumEntities").innerHTML = numEntitiesSlider.value;
            document.getElementById("strokeWidthSlider").value = Number(sw);
            document.getElementById("showStrokeWidth").innerHTML = strokeWidthSlider.value;
            window.history.pushState("", "", url.href);
            //console.log(url.href);         
            var ndefault = n;
            var piddefault = pid;
            var cdefault = c;
            var swdefault = sw;
            var seeddefault = seed;
         </script>

         <script type="text/javascript">
            $(document).on('input', '#strokeWidthSlider', function() {
                  document.getElementById("showStrokeWidth").innerHTML = strokeWidthSlider.value;
                  var url_string = window.location.href;
                  var url = new URL(url_string);
                  url.searchParams.set('sw', strokeWidthSlider.value);
                  window.history.pushState("", "", url.href);
                  setup();
               });
               //$(document).on('input', '#curvySlider', function() {
                   //document.getElementById("showCurvy").innerHTML = curvySlider.value;
               //});
               //$(document).on('input', '#shapeSwitchSlider', function() {
               //    document.getElementById("showShapeSwitch").innerHTML = shapeSwitchSlider.value;
               //});
               $(document).on('input', '#numEntitiesSlider', function() {
                   document.getElementById("showNumEntities").innerHTML = numEntitiesSlider.value;
                   var url_string = window.location.href;
                  var url = new URL(url_string);
                  url.searchParams.set('n', numEntitiesSlider.value);
                  window.history.pushState("", "", url.href);
                  setup();
               });
               $(document).on('change', '#numEntitiesSlider', function() {
                  updateTwitter();
                });
               $(document).on('input', '#strokeWidthSlider', function() {
                   document.getElementById("showStrokeWidth").innerHTML = strokeWidthSlider.value;
                   var url_string = window.location.href;
                  var url = new URL(url_string);
                  url.searchParams.set('sw', strokeWidthSlider.value);
                  window.history.pushState("", "", url.href);
                  setup();
               });
               $(document).on('change', '#strokeWidthSlider', function() {
                  updateTwitter();
                });
               $(document).on('input', '#0', function() {
                   doPerPaletteRadioButton();
               });
               $(document).on('input', '#1', function() {
                   doPerPaletteRadioButton();
               });
               $(document).on('input', '#2', function() {
                   doPerPaletteRadioButton();
               });
               $(document).on('input', '#3', function() {
                   doPerPaletteRadioButton();
               });
               $(document).on('input', '#4', function() {
                   doPerPaletteRadioButton();
               });
               $(document).on('input', '#c0', function() {
                   doPerCurvyRadioButton();
               });
               $(document).on('input', '#c1', function() {
                   doPerCurvyRadioButton();
               });
         </script>
         <div class="cyo-action-stack">
         <div class="cyo-actions-grid">
         <button type="button" onClick="generate()">Generate</button>
         <script type="text/javascript">
            function generate() {
              var url_string = window.location.href;
              var url = new URL(url_string);
              var seed = Math.random();
              url.searchParams.set('seed',seed);
              window.history.pushState("", "", url.href);
              setup();
              updateTwitter();
            };
         </script>
         <button type="button" onClick="reset()">Reset</button>
         </div>
         <script type="text/javascript">
            function reset() {
              var url_string = window.location.href;
              var url = new URL(url_string);
              url.searchParams.set('n', ndefault);
              url.searchParams.set('pid', piddefault);
              url.searchParams.set('sw', swdefault);
              url.searchParams.set('c', cdefault);
              url.searchParams.set('seed', seeddefault);
              document.getElementById(piddefault).checked = true;
              document.getElementById(['c'+cdefault]).checked = true;
              document.getElementById("numEntitiesSlider").value = Number(ndefault);
              document.getElementById("showNumEntities").innerHTML = numEntitiesSlider.value;
              document.getElementById("strokeWidthSlider").value = Number(swdefault);
              document.getElementById("showStrokeWidth").innerHTML = strokeWidthSlider.value;
              window.history.pushState("", "", url.href);
              setup();
              updateTwitter();
            };
         </script>
         <div class="cyo-actions-grid">
         <a id="download" download="myart.png" target="_blank">
         <button type="button" onClick="download()">Save PNG</button>
         </a>
        <button type="button" onClick="postOnX()">Post on X</button>
         </div>
         </div>
         <script type="text/javascript">
            function download() {
              var download = document.getElementById("download");
              var image = document.getElementById("mycanvas").toDataURL("image/png");
              download.setAttribute("href", image);
            };
         </script>
        <div class="cyo-note-block">
        <p class="cyo-legal cyo-note">Not to be used for commercial purposes without prior consent.</p>
        </div>

         <script>
           updateTwitter();
         </script>
         
      </aside>
      <div class="cyo-canvas-shell">
      <div id="sketch-holder">
         <script src="strokes.js"></script>
      </div>
