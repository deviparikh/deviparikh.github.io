         <div class="cyo-eyebrow">Algorithmic Art</div>

         <p class="cyo-text">Tune the grid, curve, and palette to grow a leaf pattern.</p>

         <div class="cyo-control-stack">
            <div class="cyo-slider-group">
               <div class="cyo-control-label">
                  <span class="cyo-control-title">Columns</span>
                  <span id="showNC" class="cyo-control-value"></span>
               </div>
               <input id="numColumns" type="range" min="1" max="50" step="1" value="10" class="slider">
            </div>
            <div class="cyo-slider-group">
               <div class="cyo-control-label">
                  <span class="cyo-control-title">Rows</span>
                  <span id="showNR" class="cyo-control-value"></span>
               </div>
               <input id="numRows" type="range" min="1" max="50" step="1" value="10" class="slider">
            </div>
            <div class="cyo-slider-group">
               <div class="cyo-control-label">
                  <span class="cyo-control-title">Irregular grid</span>
                  <span id="showGN" class="cyo-control-value"></span>
               </div>
               <input id="gridNoise" type="range" min="0" max="1" step="0.05" value="0.1" class="slider">
            </div>
            <div class="cyo-slider-group">
               <div class="cyo-control-label">
                  <span class="cyo-control-title">Height</span>
                  <span id="showVS" class="cyo-control-value"></span>
               </div>
               <input id="verticalSize" type="range" min="0.01" max="1" step="0.01" value="0.25" class="slider">
            </div>
            <div class="cyo-slider-group">
               <div class="cyo-control-label">
                  <span class="cyo-control-title">Curve 1</span>
                  <span id="showOL" class="cyo-control-value"></span>
               </div>
               <input id="offsetLeft" type="range" min="-1" max="1" step="0.05" value="-0.1" class="slider">
            </div>
            <div class="cyo-slider-group">
               <div class="cyo-control-label">
                  <span class="cyo-control-title">Curve 2</span>
                  <span id="showOR" class="cyo-control-value"></span>
               </div>
               <input id="offsetRight" type="range" min="-1" max="1" step="0.05" value="0.2" class="slider">
            </div>
            <div class="cyo-slider-group">

                  <span id="showD" class="cyo-control-value"></span>
               </div>

                  <input id="e3" type="radio" name="edgeColor" value="3" checked="checked">

                  <input id="e4" type="radio" name="edgeColor" value="4">
                  <label class="cyo-swatch cyo-swatch--edge" for="e4"><span class="cyo-swatch-square" style="background: rgb(0, 0, 0);"></span></label>
               </div>
            </div>
            <div class="cyo-slider-group">
               <div class="cyo-control-label">
                  <span class="cyo-control-title">Edge thickness</span>
                  <span id="showSW" class="cyo-control-value"></span>
               </div>
               <input id="strokeWidth" type="range" min="0" max="6" step="0.2" value="0" class="slider">
            </div>

         <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
         <script>
            var url_string = window.location.href;
            var url = new URL(url_string);
            var pid = url.searchParams.get("pid");
            var eid = url.searchParams.get("eid");
            var gn = url.searchParams.get("gn");
            var sw = url.searchParams.get("sw");
            var ol = url.searchParams.get("ol");
            var or = url.searchParams.get("or");
            var vs = url.searchParams.get("vs");
            var nc = url.searchParams.get("nc");
            var nr = url.searchParams.get("nr");
            var d = url.searchParams.get("d");
            var seed = url.searchParams.get("seed");
            if (pid == null){
              pid = $("input[name='palette']:checked").val();
              url.searchParams.append('pid',pid);
            }
            if (eid == null){
              eid = $("input[name='edgeColor']:checked").val();
              url.searchParams.append('eid',eid);
            }
            if (gn == null){
              gn = gridNoise.value;
              url.searchParams.append('gn',gn);
            }
            if (nc == null){
              nc = numColumns.value;
              url.searchParams.append('nc',nc);
            }
            if (nr == null){
              nr = numRows.value;
              url.searchParams.append('nr',nr);
            }
            if (d == null){
              d = drop.value;
              url.searchParams.append('d',d);
            }
            if (sw == null){
              sw = strokeWidth.value;
              url.searchParams.append('sw',sw);
            }
            if (ol == null){
              ol = offsetLeft.value;
              url.searchParams.append('ol',ol);
            }
            if (or == null){
              or = offsetRight.value;
              url.searchParams.append('or',or);
            }
            if (vs == null){
              vs = verticalSize.value;
              url.searchParams.append('vs',vs);
            }
            if (seed == null){
              seed = Math.random();
              url.searchParams.append('seed',seed);
            };
            document.getElementById(pid).checked = true;
            document.getElementById(['e'+eid]).checked = true;
            document.getElementById("gridNoise").value = Number(gn);
            document.getElementById("showGN").innerHTML = gridNoise.value;
            document.getElementById("numColumns").value = Number(nc);
            document.getElementById("showNC").innerHTML = numColumns.value;
            document.getElementById("numRows").value = Number(nr);
            document.getElementById("showNR").innerHTML = numRows.value;
            document.getElementById("drop").value = Number(d);
            document.getElementById("showD").innerHTML = drop.value;
            document.getElementById("strokeWidth").value = Number(sw);
            document.getElementById("showSW").innerHTML = strokeWidth.value;
            document.getElementById("verticalSize").value = Number(vs);
            document.getElementById("showVS").innerHTML = verticalSize.value;
            document.getElementById("offsetLeft").value = Number(ol);
            document.getElementById("showOL").innerHTML = offsetLeft.value;
            document.getElementById("offsetRight").value = Number(or);
            document.getElementById("showOR").innerHTML = offsetRight.value;
            window.history.pushState("", "", url.href);
            //console.log(url.href);         
            var gndefault = gn;
            var ncdefault = nc;
            var nrdefault = nr;
            var ddefault = d;
            var piddefault = pid;
            var eiddefault = eid;
            var swdefault = sw;
            var vsdefault = vs;
            var oldefault = ol;
            var ordefault = or;
            var seeddefault = seed;
         </script>

         <button type="button" onClick="generate()">Generate</button>
         <script type="text/javascript">
            function generate() {
              var url_string = window.location.href;
              var url = new URL(url_string);
              var seed = Math.random();
              url.searchParams.set('seed',seed);
              window.history.pushState("", "", url.href);
              setup();
              updateTwitter();
            };

         <button type="button" onClick="reset()">Reset</button>

         <script type="text/javascript">
            function reset() {
              var url_string = window.location.href;

              url.searchParams.set('nr', nrdefault);
              url.searchParams.set('d', ddefault);
              url.searchParams.set('pid', piddefault);
              url.searchParams.set('eid', eiddefault);
              url.searchParams.set('sw', swdefault);
              url.searchParams.set('vs', vsdefault);

              url.searchParams.set('or', ordefault);
              url.searchParams.set('seed', seeddefault);
              document.getElementById(piddefault).checked = true;
              document.getElementById(['e'+eiddefault]).checked = true;
              document.getElementById("gridNoise").value = Number(gndefault);
