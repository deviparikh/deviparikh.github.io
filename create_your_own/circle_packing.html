        <script>
          function doPerPaletteRadioButton() {
          var url_string = window.location.href;
              var url = new URL(url_string);
              url.searchParams.set('pid',$("input[name='palette']:checked").val());

         <div class="cyo-eyebrow">Algorithmic Art</div>
         <h1 class="cyo-title">Circle Packing</h1>
         <p class="cyo-text cyo-intro">Choose a palette and number of colors to grow a packed field of circles.</p>
         <div class="cyo-stack-sm">
         <div class="cyo-eyebrow cyo-section-title">Palette</div>
         <div class="cyo-swatch-grid cyo-swatch-grid--palette">
         <input id = "1" type="radio" name="palette" value="1">
         <label class="cyo-swatch" for="1"><span class="cyo-swatch-circle" style="background: conic-gradient(#c0392b 0 20%, #16a085 20% 40%, #2c3e50 40% 60%, #f39c12 60% 80%, #2980b9 80% 100%);"></span></label>
         <input id = "2" type="radio" name="palette" value="2">
         <label class="cyo-swatch" for="2"><span class="cyo-swatch-circle" style="background: conic-gradient(#1E272E 0 20%, #2F3542 20% 40%, #57606F 40% 60%, #A4B0BE 60% 80%, #CED6E0 80% 100%);"></span></label>
         <input id = "3" type="radio" name="palette" value="3">
         <label class="cyo-swatch" for="3"><span class="cyo-swatch-circle" style="background: conic-gradient(#D84E5F 0 20%, #0264E4 20% 40%, #2F4D47 40% 60%, #F8A54A 60% 80%, #B39183 80% 100%);"></span></label>
         <input id = "4" type="radio" name="palette" value="4">
         <label class="cyo-swatch" for="4"><span class="cyo-swatch-circle" style="background: conic-gradient(#7CCBB5 0 20%, #F1BC52 20% 40%, #6CB6C8 40% 60%, #BAB7AF 60% 80%, #FE7453 80% 100%);"></span></label>
         <input id = "5" type="radio" name="palette" value="5" checked="checked">
         <label class="cyo-swatch" for="5"><span class="cyo-swatch-circle" style="background: conic-gradient(#2980b9 0 20%, #7f8c8d 20% 40%, #16a085 40% 60%, #27ae60 60% 80%, #c0392b 80% 100%);"></span></label>
         </div>
         </div>
         <div class="cyo-control-stack cyo-control-stack--compact">
         <div class="cyo-slider-group">
         <div class="cyo-control-label">
         <span class="cyo-control-title">How many colors?</span>
         <span id="showNumColors" class="cyo-control-value">5</span>
         </div>
         <input id="numColorsSlider" type="range" min="1" max="5" value="5" class="slider">
         </div>
         </div>
         <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
         <script>
            var url_string = window.location.href;
            var url = new URL(url_string);
            var pid = url.searchParams.get("pid");
            var n = url.searchParams.get("n");
            var seed = url.searchParams.get("seed");
            if (pid == null){
              pid = $("input[name='palette']:checked").val();
              url.searchParams.append('pid',pid);
            }
            if (n == null){
              n = numColorsSlider.value;
              url.searchParams.append('n',n);
            }
            if (seed == null){
              seed = Math.random();
              url.searchParams.append('seed',seed);
            };
            document.getElementById(pid).checked = true;
            document.getElementById("numColorsSlider").value = Number(n);
            document.getElementById("showNumColors").innerHTML = numColorsSlider.value;
            window.history.pushState("", "", url.href);
            //console.log(url.href);         
            var ndefault = n;
            var piddefault = pid;
            var seeddefault = seed;
         </script>
         <script type="text/javascript">
            $(document).on('input', '#numColorsSlider', function() {
                document.getElementById("showNumColors").innerHTML = numColorsSlider.value;
                var url_string = window.location.href;
                var url = new URL(url_string);
                url.searchParams.set('n', numColorsSlider.value);
                window.history.pushState("", "", url.href);
                setup();
                //updateTwitter();
            });
            $(document).on('change', '#numColorsSlider', function() {
              updateTwitter();
            });
            $(document).on('input', '#1', function() {
              doPerPaletteRadioButton();
            });
            $(document).on('input', '#2', function() {
              doPerPaletteRadioButton();
            });

            $(document).on('input', '#3', function() {
              doPerPaletteRadioButton();
            });
            $(document).on('input', '#4', function() {
              doPerPaletteRadioButton();
            });
            $(document).on('input', '#5', function() {
              doPerPaletteRadioButton();
            });
         </script>
         <div class="cyo-action-stack">
         <div class="cyo-actions-grid">
         <button type="button" onClick="generate()">Generate</button>
        <script type="text/javascript">
            function generate() {
              var url_string = window.location.href;
              var url = new URL(url_string);
              var seed = Math.random();
              url.searchParams.set('seed',seed);
              window.history.pushState("", "", url.href);
              setup();
              updateTwitter();
            };
         </script>
        <button type="button" onClick="reset()">Reset</button>
         </div>
         <script type="text/javascript">
            function reset() {
              var url_string = window.location.href;
              var url = new URL(url_string);
              url.searchParams.set('n', ndefault);
              url.searchParams.set('pid', piddefault);
              url.searchParams.set('seed', seeddefault);
              document.getElementById(piddefault).checked = true;
              document.getElementById("numColorsSlider").value = Number(ndefault);
              document.getElementById("showNumColors").innerHTML = numColorsSlider.value;
              window.history.pushState("", "", url.href);
              setup();
              updateTwitter();
            };
         </script>
         <div class="cyo-actions-grid">
         <a id="download" download="myart.png" target="_blank">
         <button type="button" onClick="download()">Save PNG</button>
         </a>
         <button type="button" onClick="postOnX()">Post on X</button>
         </div>

         <script type="text/javascript">
            function download() {
              var download = document.getElementById("download");
              var image = document.getElementById("mycanvas").toDataURL("image/png");
              download.setAttribute("href", image);
            }
         </script>

           updateTwitter();
         </script>
